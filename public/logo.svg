  <!-- Typography & Brand Text -->
  <g transform="translate(195, 140)">
    <!-- THE RAM SHAM Main Brand Name -->
    <text x="0" y="0" class="logo-title" fill="#0A0A09">THE RAM SHAM</text>
    
    <!-- Registered Trademark Circle-R Symbol (R) -->
    <g transform="translate(378, -32)">
      <circle cx="10" cy="10" r="9" stroke="#0A0A09" stroke-width="1.4" fill="none" />
      <text x="10" y="14" font-family="'Playfair Display', serif" font-size="11" font-weight="700" fill="#0A0A09" text-anchor="middle">R</text>
    </g>

    <!-- Subtitle Bar: CMYK Registration Dots + WEDDING PHOTOGRAPHY + CMYK Dots -->
    <g transform="translate(0, 19)">
      <!-- Left 3 Registration Dots (Cyan, Magenta, Yellow) -->
      <circle cx="3" cy="-4" r="2.8" fill="#00AEEF" />
      <circle cx="12" cy="-4" r="2.8" fill="#EC008C" />
      <circle cx="21" cy="-4" r="2.8" fill="#FFD700" />
      
      <!-- Left Connecting Line -->
      <line x1="28" y1="-4" x2="44" y2="-4" stroke="#0A0A09" stroke-width="1.8" />

      <!-- Subtitle Text: WEDDING PHOTOGRAPHY in Red -->
      <text x="50" y="0" class="logo-subtitle" fill="#E02424">WEDDING PHOTOGRAPHY</text>

      <!-- Right Connecting Line -->
      <line x1="334" y1="-4" x2="350" y2="-4" stroke="#0A0A09" stroke-width="1.8" />

